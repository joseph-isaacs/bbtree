[package]
name = "bbtree"
version = "0.1.5"
edition = "2024"
description = "Fastest B-tree."
license = "MIT OR Apache-2.0"
repository = "https://github.com/XiangpengHao/bbtree"
readme = "../README.md"

[dependencies]
# Verus's specs and proofs, purely ghost, gone after compilation.
vstd = { version = "=0.0.0-2026-08-30-0159", default-features = false }

# Shuttle explores the latched tree's thread interleavings in tests built
# with `--cfg shuttle` (`src/tree/interleaving.rs`), like loom's `cfg(loom)`:
# no feature, so `--all-features` builds and users never see it.
[target.'cfg(shuttle)'.dev-dependencies]
shuttle = "0.9.7"

[features]
# File maps (`bbtree::file`): a map compacted into one byte string that a reader
# maps from a file and uses in place.
file = []
# Read-only views of a map's nodes (`BBTreeMap::inspect`), for the visualizer
# in `vis/`. No stability promise.
inspect = []
# Experiment (idea 2, not for release): a leaf's pointer carries its length
# in its spare low bits, and a lookup reads the entry it predicts from them
# beside the leaf's inline keys. `unsync::BBTreeMap::refresh_len_hints` sets
# the hints; changes after it leave them stale, which only costs accuracy.
entry-probe = []

[lints.rust]
# Verus sets `verus_only` while it verifies: the proofs' modules, which only
# it reads, are behind it.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)", "cfg(shuttle)", "cfg(verus_only)"] }

[package.metadata.verus]
verify = true
